<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>DevPath Editor</title>
  <link rel="stylesheet" href="codemirror.css">
  <link rel="stylesheet" href="theme/material-darker.css">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #212121;
    }
    .CodeMirror {
      height: 100% !important;
      font-family: Menlo, Monaco, 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .CodeMirror-scroll {
      overflow: scroll !important;
      margin-bottom: 0; margin-right: 0;
      padding-bottom: 0;
    }
  </style>
</head>
<body>
  <textarea id="editor" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  <script src="codemirror.js"></script>
  <script src="addon/edit/matchbrackets.js"></script>
  <script src="mode/xml/xml.js"></script>
  <script src="mode/javascript/javascript.js"></script>
  <script src="mode/css/css.js"></script>
  <script src="mode/htmlmixed/htmlmixed.js"></script>
  <script src="mode/clike/clike.js"></script>
  <script src="mode/php/php.js"></script>
  <script src="mode/markdown/markdown.js"></script>

  <script>
    (function() {
      var textarea = document.getElementById('editor');
      var currentFileId = null;
      var debounce = null;
      var editor = CodeMirror.fromTextArea(textarea, {
        lineNumbers: true,
        lineWrapping: false,
        matchBrackets: true,
        autoCloseBrackets: true,
        indentUnit: 2,
        tabSize: 2,
        indentWithTabs: false,
        theme: 'material-darker',
        mode: 'htmlmixed',
        viewportMargin: Infinity
      });

      function send(payload) {
        try {
          if (window.FlutterBridge) {
            FlutterBridge.postMessage(JSON.stringify(payload));
          }
        } catch (e) {}
      }

      window.setCode = function(fileId, code, mode) {
        currentFileId = fileId;
        var nextMode = mode || 'text/plain';
        if (editor.getOption('mode') !== nextMode) {
          editor.setOption('mode', nextMode);
        }
        var next = code || '';
        if (editor.getValue() !== next) {
          editor.setValue(next);
        }
      };

      window.getCode = function() {
        return editor.getValue();
      };

      window.configureEditor = function(opts) {
        if (!opts) return;
        if (typeof opts.lineNumbers === 'boolean') {
          editor.setOption('lineNumbers', opts.lineNumbers);
        }
        if (typeof opts.wordWrap === 'boolean') {
          editor.setOption('lineWrapping', opts.wordWrap);
        }
        if (typeof opts.fontSize === 'number') {
          editor.getWrapperElement().style.fontSize = opts.fontSize + 'px';
        }
        if (typeof opts.darkTheme === 'boolean') {
          editor.setOption('theme', opts.darkTheme ? 'material-darker' : 'default');
        }
        editor.refresh();
      };

      window.flushPending = function() {
        if (debounce) { clearTimeout(debounce); debounce = null; }
        if (currentFileId != null) {
          send({ type: 'change', fileId: currentFileId, content: editor.getValue() });
        }
      };

      editor.on('change', function() {
        if (debounce) clearTimeout(debounce);
        debounce = setTimeout(function() {
          if (currentFileId != null) {
            send({ type: 'change', fileId: currentFileId, content: editor.getValue() });
          }
        }, 120);
      });

      send({ type: 'ready' });
    })();
  </script>
</body>
</html>
