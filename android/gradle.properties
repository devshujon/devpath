# JVM memory for Gradle daemon. Bumped to 4G to handle AGP 8.11 +
# Kotlin 2.2 + R8 / desugaring on larger codebases without OOM.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# AndroidX is mandatory for AGP 8+.
android.useAndroidX=true

# Jetifier rewrites legacy support-library deps to AndroidX at build time.
# Off by default in modern projects; enable only if a dep needs it.
android.enableJetifier=false

# Parallel + caching speed up incremental builds.
org.gradle.parallel=true
org.gradle.caching=true

# Non-transitive R class is the default in AGP 8+ and reduces APK size.
android.nonTransitiveRClass=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
